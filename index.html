/* ===== AUDIO (Web Audio, todo procedural) ===== */
let AC,mus=null;
function tone(f,d=.1,t='square',v=.3,w=0,bus='s'){if(OP.mute)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+w,vol=Math.max(.0001,v*(bus=='s'?OP.sv:OP.mv));o.type=t;o.frequency.value=f;g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}

const SFX={click:()=>tone(700,.05,'square',.15),hit:()=>{tone(140,.12,'sawtooth',.4);tone(90,.15,'square',.3,.03)},crit:()=>{tone(900,.1,'square',.3);tone(120,.25,'sawtooth',.5,.05)},heal:()=>arp([523,659,784,1046],.15,'sine',.3,.07),lvl:()=>arp([392,523,659,784,1046],.2,'triangle',.4,.1),boom:()=>{tone(50,1.2,'sawtooth',.9);tone(35,1.5,'square',.8);tone(900,.3,'sawtooth',.4,.1)},bus:()=>{tone(60,.3,'sawtooth',.2);tone(63,.3,'sawtooth',.2,.3)},step:()=>tone(100,.04,'square',.08),skill:()=>arp([300,500,800],.1,'sawtooth',.2,.05),bad:()=>tone(150,.3,'sawtooth',.3),win:()=>arp([523,523,523,659,784],.18,'square',.3,.12)};

function music(n){clearInterval(mus);if(!n)return;const k=TRK[n];let i=0;mus=setInterval(()=>{const s=k.s[i%k.s.length];tone(k.r*2**(s/12),k.t/1000*.9,k.w,k.v,0,'m');if(i%4==0)tone(k.r/2*2**(s/12),k.t/1000*3,'sine',.14,0,'m');i++},k.t)}
/* ===== EFECTOS / UI ===== */
const shake=()=>{const g=$('#g');g.classList.remove('sh');void g.offsetWidth;g.classList.add('sh')};

let ttm;const toast=(t,ms=1800)=>{const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(ttm);ttm=setTimeout(()=>e.style.display='none',ms)};

function ask(o,ms,sel='#ch'){return new Promise(res=>{let to;const u=$(sel),tm=$('#tm'),done=i=>{clearTimeout(to);tm.style.display='none';u.innerHTML='';res(i)};u.innerHTML='';o.forEach((t,i)=>{const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{SFX.click();done(i)};u.appendChild(b)});if(ms){tm.style.display='block';const b=tm.firstChild;b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition=`width ${ms}ms linear`;b.style.width='0';to=setTimeout(()=>done(-1),ms)}})}
const PN={narr:['','📖'],mar:['Doña Marlene','👩‍🍳'],bib:['Bibliotecaria','👩‍🏫'],ruiz:['Profe Hermes','👨‍🏫'],mal:['Malakar','😈'],bus:['Don Chepe','🚌'],sen:['Señora del abanico','👵'],ven:['Vendedor','🧃']};
function say(w,t){if(w=='lib'&&S&&S.pc&&S.pc!='lib'&&S.step==1)w=S.pc;return new Promise(res=>{const d=$('#dlg'),p=CH[w]?[CH[w].n,CH[w].e]:PN[w]||[w,'💬'],tx=$('#tx');d.style.display='flex';$('#nm').textContent=p[0];$('#pt').innerHTML=(typeof PH!='undefined'&&PH[w])?'<img src="'+PH[w]+'">':p[1];tx.textContent='';let i=0,done=0;const iv=setInterval(()=>{tx.textContent=t.slice(0,++i);if(i%3==0&&w!='narr')tone(300+rnd(0,80),.03,'square',.05);if(i>=t.length){clearInterval(iv);done=1}},20);
const fin=()=>{if(!done){clearInterval(iv);tx.textContent=t;done=1;return}d.onclick=null;removeEventListener('keydown',kh);d.style.display='none';res()};const kh=e=>{if(e.key=='Enter'||e.key==' ')fin()};addEventListener('keydown',kh);d.onclick=fin})}
/* ===== DATOS ===== */
const CH={lib:{n:'Libardo',e:'🧑‍💻',cl:'Support',hp:90,mp:60,atk:9,def:7,mag:16,spd:12,luk:15},gab:{n:'Gabriel',e:'🧐',cl:'Tanque/Estratega',hp:140,mp:40,atk:12,def:14,mag:8,spd:8,luk:8},fre:{n:'Freddy',e:'⚽',cl:'Daño/Velocidad',hp:100,mp:40,atk:18,def:8,mag:5,spd:16,luk:10},cml:{n:'Camilinho',e:'🚬',cl:'Debilitador/Caos',hp:85,mp:55,atk:10,def:6,mag:15,spd:14,luk:12},cfo:{n:'Camilo Fortuna',e:'🪗',cl:'Bardo de Sonido',hp:90,mp:70,atk:8,def:7,mag:18,spd:11,luk:9}};
const PARTY=['lib','gab','fre','cml','cfo'],G={hp:14,mp:6,atk:2,def:2,mag:2,spd:1,luk:1};
const stat=(id,k)=>Math.round(CH[id][k]+((S.L?S.L[id]:S.lv)-1)*G[k]+(S.bonus[k]||0)+(id=='lib'?S.lb[k]||0:0)+((S.pb&&S.pb[id]&&S.pb[id][k])||0));
const SK={lib:[{n:'Curita Chiviada',mp:8,k:'heal',p:1.8,t:'ally'},{n:'Tin Tin Motivacional',mp:12,k:'buff',b:'atk',t:'team'},{n:'¡Ruleta Rusa! (caos)',mp:10,k:'chaos',t:'self'},{n:'Lengua Suelta (miedo)',mp:8,k:'st',st:'miedo',t:'one'}],
gab:[{n:'Escudo de Pupitre',mp:8,k:'buff',b:'def',t:'team'},{n:'¡Aquí Estoy Yo!',mp:6,k:'taunt',t:'self'},{n:'Analizar (débil)',mp:5,k:'st',st:'debil',t:'one'},{n:'Contragolpe',mp:10,k:'dmg',p:2.2,t:'one',el:'fisico'}],
fre:[{n:'Remate de Esquina',mp:8,k:'dmg',p:2.4,t:'one',el:'fuego'},{n:'Chilena',mp:12,k:'dmg',p:3,t:'one',el:'fuego',crit:.5},{n:'Tiro Libre Infernal',mp:16,k:'dmg',p:1.5,t:'all',el:'fuego'}],
cml:[{n:'Humareda (veneno)',mp:12,k:'st',st:'veneno',t:'all'},{n:'Calada Sorpresa',mp:8,k:'dmg',p:2,t:'one',el:'humo',st:'ciego'},{n:'Ni Yo Sé Qué Hice',mp:14,k:'dmg',p:3.4,t:'one',el:'humo',crit:.35}],
cfo:[{n:'Aire de Acordeón',mp:10,k:'dmg',p:1.4,t:'all',el:'sonido',mag:1},{n:'Vallenato Motivador',mp:14,k:'buff',b:'atk',t:'team'},{n:'¡PARRANDA VALLENATA!',mp:30,k:'dmg',p:3,t:'all',el:'sonido',mag:1}]};
const EN={dia:{n:'Diablillo de Parqueadero',e:'👺',hp:60,atk:14,def:4,spd:10,weak:'sonido',xp:20,g:3},zan:{n:'Zancudo Infernal',e:'🦟',hp:45,atk:11,def:2,spd:18,weak:'fuego',xp:18,g:2,st:'veneno'},zom:{n:'Estudiante Zombi',e:'🧟',hp:90,atk:16,def:6,spd:5,weak:'fuego',xp:30,g:5},ruiz:{n:'Profe Hermes Poseído',e:'👹',hp:420,atk:20,def:8,spd:9,xp:150,g:50,boss:1}};
const IT={empanada:{n:'🥟 Empanada (+50 HP)',f:t=>{t.hp=Math.min(t.mhp,t.hp+50);pop(t,'+50','#6f6')}},tinto:{n:'☕ Tinto (+30 MP)',f:t=>{t.mp=Math.min(t.mmp,t.mp+30);pop(t,'+30MP','#6cf')}},gaseosa:{n:'🥤 Gaseosa (cura estados)',f:t=>{t.st={};t.hp=Math.min(t.mhp,t.hp+20);pop(t,'+20','#6f6')}}};
const healAll=()=>PARTY.forEach(id=>{S.hp[id]=stat(id,'hp');S.mp[id]=stat(id,'mp')});
const newS=()=>{S={step:0,lv:1,xp:0,L:{lib:1,gab:1,fre:1,cml:1,cfo:1},X:{lib:0,gab:0,fre:0,cml:0,cfo:0},pc:'lib',pb:{},sp:{lib:2,gab:2,fre:2,cml:2,cfo:2},un:{},gold:12,inv:{empanada:2,tinto:1,gaseosa:0,vape:1},f:{},rel:{gab:0,fre:0,cml:0,cfo:0},lb:{hp:0,mp:0,luk:0},bonus:{},car:0,ach:{},hp:{},mp:{}};healAll()};
const hurt=(id,n)=>{S.hp[id]=Math.max(1,S.hp[id]-n)};
function ach(k,t){if(S.ach[k])return;S.ach[k]=1;SFX.lvl();toast('🏆 Logro: '+t,2500)}
/* ===== GUARDADO ===== */
function save(k='a'){try{S.lbl=`Paso ${S.step+1}/${STEPS.length} · Nv ${S.lv}`;localStorage['up_'+k]=JSON.stringify(S)}catch(e){}}
function load(k){try{return JSON.parse(localStorage['up_'+k])}catch(e){return null}}
/* ===== COMBATE ===== */
const al=a=>a.filter(x=>x.hp>0);
function mk(id){const u={id,p:1,n:CH[id].n,e:CH[id].e,mhp:stat(id,'hp'),mmp:stat(id,'mp'),st:{},b:{}};['atk','def','mag','spd','luk'].forEach(k=>u[k]=stat(id,k));u.hp=Math.min(S.hp[id]??u.mhp,u.mhp);u.mp=Math.min(S.mp[id]??u.mmp,u.mmp);return u}
function mkE(k){const d=EN[k],sc=1+(S.lv-1)*.12;const h=Math.round(d.hp*sc);return{p:0,d,n:d.n,e:d.e,mhp:h,hp:h,mmp:0,mp:0,atk:d.atk*sc,def:d.def*sc,mag:d.atk*sc,spd:d.spd,luk:5,weak:d.weak,st:{},b:{}}}
function render(P,E){const a=$('#arena');a.innerHTML='';[E,P].forEach(t=>{const r=document.createElement('div');r.className='row';t.forEach(u=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class=e>${(typeof PH!='undefined'&&u.p&&PH[u.id])?`<img src="${PH[u.id]}">`:u.e}</div><div>${u.n.split(' ')[0]}</div><div class=b><i></i></div>${u.p?'<div class="b m"><i></i></div>':''}<div class=s></div>`;u.el=c;r.appendChild(c)});a.appendChild(r)});[...P,...E].forEach(upd)}
function upd(u){const c=u.el;c.querySelector('.b i').style.width=Math.max(0,u.hp/u.mhp*100)+'%';const m=c.querySelector('.m i');if(m)m.style.width=u.mp/u.mmp*100+'%';c.classList.toggle('dead',u.hp<=0);c.querySelector('.s').textContent=(u.st.veneno?'☠️':'')+(u.st.miedo?'😱':'')+(u.st.ciego?'🕶️':'')+(u.st.debil?'🎯':'')+(u.b.atk?'⬆️':'')+(u.b.def?'🛡️':'')+(u.st.taunt?'📣':'')}
function pop(u,t,c='#fff'){const d=document.createElement('div');d.className='pop';d.textContent=t;d.style.color=c;u.el.appendChild(d);setTimeout(()=>d.remove(),1000)}
function dmg(u,t,o){if(u.st.ciego&&Math.random()<.5){pop(t,'Falló');return 0}let a=(o.mag?u.mag:u.atk)*(u.b.atk?1.4:1)*(u.st.miedo?.6:1),d=a*(o.p||1)*1.3-t.def*(t.b.def?1.8:1)*.6,x='',c='#fff';d*=rnd(90,110)/100;
if(t.weak&&t.weak===o.el){d*=1.5;x='💥'}if(t.st.debil)d*=1.3;if(Math.random()<(o.crit||.08)+u.luk*.004){d*=1.6;x+='¡CRÍTICO! ';SFX.crit();c='#fc3'}else SFX.hit();if(!u.p)d*=[.7,1,1.4][OP.dif];d=Math.max(1,Math.round(d));t.hp=Math.max(0,t.hp-d);pop(t,x+'-'+d,c);t.el.classList.add('act');setTimeout(()=>t.el.classList.remove('act'),200);if(t.p)shake();return d}
function addSt(t,s,n=3){if(t.hp<=0)return;t.st[s]=n;pop(t,{veneno:'☠️Veneno',miedo:'😱Miedo',ciego:'🕶️Ciego',debil:'🎯Débil'}[s],'#c8f');upd(t)}
async function pickT(l){const a=al(l),i=await ask([...a.map(x=>`${x.n} ${Math.max(0,Math.round(x.hp))}/${x.mhp}`),'↩ Volver']);return i>=0&&i<a.length?a[i]:null}
async function useSk(u,s,T,P,E){log(`${u.n}: ${s.n}`);u.el.classList.add('act');SFX.skill();await sleep(300);u.el.classList.remove('act');const ts=s.t=='all'?al(E):s.t=='team'?al(P):s.t=='self'?[u]:[T];
if(s.k=='dmg')ts.forEach(t=>{dmg(u,t,s);if(s.st)addSt(t,s.st)});
else if(s.k=='heal'){SFX.heal();ts.forEach(t=>{const h=Math.round(u.mag*s.p*2.2);t.hp=Math.min(t.mhp,t.hp+h);pop(t,'+'+h,'#6f6')})}
else if(s.k=='buff')ts.forEach(t=>{t.b[s.b]=4;pop(t,s.b=='atk'?'⬆️ATK':'🛡️DEF','#fc3')});
else if(s.k=='taunt'){u.st.taunt=4;u.b.def=4;pop(u,'¡Aquí!','#fc3')}
else if(s.k=='st')ts.forEach(t=>addSt(t,s.st));
else if(s.k=='chaos'){const r=Math.random();if(r<.12){log('¡JACKPOT! Libardo se ilumina');al(P).forEach(t=>{t.hp=t.mhp;t.mp=t.mmp;t.b.atk=4;pop(t,'FULL','#fc3')});SFX.lvl()}else if(r<.5){log('¡Sale increíble!');SFX.heal();al(P).forEach(t=>{const h=Math.round(u.mag*2);t.hp=Math.min(t.mhp,t.hp+h);pop(t,'+'+h,'#6f6')})}else if(r<.8){log('Sale a medias: ¡rayos al azar!');al(E).forEach(t=>dmg(u,t,{mag:1,p:1.2,el:'caos'}))}else{log('¡Salió mal! Libardo se tropieza...');u.hp=Math.max(1,u.hp-12);pop(u,'-12','#f66');SFX.bad()}}}
async function pTurn(u,P,E){while(1){const c=await ask(['⚔️ Atacar','✨ Habilidad','🎒 Objeto','🛡️ Defender']);

/* --- minijuego Undertale: esquiva proyectiles moviendo el corazón (flechas/WASD o dedo) --- */
function dodge(ms,n,em='📝'){return new Promise(res=>{const c=$('#dg'),x=c.getContext('2d');c.style.display='block';let hx=160,hy=130,hits=0,b=[],inv=0;const t0=performance.now();
const mv=e=>{const r=c.getBoundingClientRect();hx=Math.max(8,Math.min(312,(e.clientX-r.left)/r.width*320));hy=Math.max(8,Math.min(172,(e.clientY-r.top)/r.height*180))};c.onpointermove=mv;c.onpointerdown=mv;
const lp=()=>{const t=performance.now()-t0;if(K.arrowleft||K.a)hx-=3.2;if(K.arrowright||K.d)hx+=3.2;if(K.arrowup||K.w)hy-=3.2;if(K.arrowdown||K.s)hy+=3.2;hx=Math.max(8,Math.min(312,hx));hy=Math.max(8,Math.min(172,hy));
if(Math.random()<n)b.push({x:rnd(5,315),y:-6,v:1.6+Math.random()*2.2,w:Math.random()*2-1});
x.fillStyle='#000';x.fillRect(0,0,320,180);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(1,1,318,178);x.textAlign='center';x.textBaseline='middle';x.font='15px serif';
b=b.filter(o=>{o.y+=o.v;o.x+=o.w*.6;x.fillText(em,o.x,o.y);if(inv<=0&&Math.hypot(o.x-hx,o.y-hy)<9){hits++;inv=30;shake();SFX.hit()}return o.y<190});inv--;
x.fillStyle=inv>0&&inv%6<3?'#fff':'#f00';x.fillText('❤',hx,hy);x.fillStyle='#fff';x.font='11px monospace';x.fillText('¡ESQUIVA! mueve el ❤',160,172);
if(t<ms)requestAnimationFrame(lp);else{c.style.display='none';res(hits)}};lp()})}

async function eTurn(u,P){const a=al(P);let t=a.find(x=>x.st.taunt)||pick(a);if(u.d.only)t=a.find(x=>x.id==u.d.only)||t;
u.el.classList.add('act');setTimeout(()=>u.el.classList.remove('act'),250);const bn=u.d.bn||u.n,df=[.7,1,1.4][OP.dif];
if(u.d.boss){u.cd=(u.cd||0)+1;
if(u.cd%3==0){log(`¡${bn}: ${u.d.big||'PARCIAL FINAL'}! (el escudo ayuda)`);shake();SFX.boom();a.forEach(x=>{const d=Math.round(26*df*(x.b.def?.5:1));x.hp=Math.max(0,x.hp-d);pop(x,'-'+d,'#f66')});return}
if(u.cd%3==2){log(`${bn} se prepara... ¡cúbranse!`);a.forEach(x=>addSt(x,'miedo',2));return}

log(`${u.n} ataca a ${t.n}: ¡ESQUIVA!`);await sleep(500);const h=await dodge(2600,.06+OP.dif*.025,u.d.bu||u.e),d=Math.round(h*u.atk*.5*df*(t.b.def?.6:1));if(h){t.hp=Math.max(0,t.hp-d);pop(t,'-'+d,'#f66');SFX.slash();blood(t.el)}else pop(t,'¡Esquivó!','#6f6');if(h&&u.d.st&&Math.random()<.5)addSt(t,u.d.st)}

(()=>{const pad=document.getElementById('pad');if(!pad||typeof K==='undefined')return;
const bs=[...pad.querySelectorAll('[data-k]')],clear=()=>bs.forEach(b=>K[b.dataset.k]=0);

pad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')aim(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>pad.addEventListener(n,clear));
document.addEventListener('contextmenu',e=>e.preventDefault());
})();
